id: llama3_8b
name: Llama-3-8B
family: transformer_decoder
source_url: https://huggingface.co/meta-llama/Meta-Llama-3-8B/blob/main/config.json
params:
  layers: 32
  hidden: 4096
  heads: 32
  kv_heads: 8              # GQA, 4 query heads per KV head
  ffn_hidden: 14336
  ffn_type: swiglu
  vocab: 128256
  max_context: 8192
  norm: rmsnorm
  positional: rope
  tie_embeddings: false
notes: >-
  Derived parameter count 8.030 G against Meta's stated 8.03 B. KV cache at 8k context, fp16,
  batch 1: 32 x 2 x 1024 x 8192 x 2 = 1.074 GB.
