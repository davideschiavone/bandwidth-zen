id: llama2_70b
name: Llama-2-70B
family: transformer_decoder
source_url: https://huggingface.co/meta-llama/Llama-2-70b-hf/blob/main/config.json
params:
  layers: 80
  hidden: 8192
  heads: 64
  kv_heads: 8              # GQA, 8 query heads per KV head
  ffn_hidden: 28672
  ffn_type: swiglu
  vocab: 32000
  max_context: 4096
  norm: rmsnorm
  positional: rope
  tie_embeddings: false
notes: >-
  The MLPerf Inference LLM workload through v4.0, so the primary Session 5 calibration target on
  both H100 and MI300X.
