[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bwz"
version = "0.1.0"
description = "bandwidth-zen: analytical performance model for neural-network inference"
# No `readme` field: the only README lives at the repo root, and hatchling refuses
# a path outside the project directory, which made `uv sync` fail on a fresh clone.
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
bwz = "bwz.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]
# Figure generation only (scripts/plot_roofline.py). Deliberately its own group:
# the engine must never import a plotting library, and `make test` must not pull
# one in. mypy's `files` list excludes scripts/ for the same reason — matplotlib
# ships no stubs and --strict would be all noise.
plots = [
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["bwz"]

# profiles/ lives outside the package per PROMPT.md §2, so an installed wheel would
# otherwise ship without it. bwz.spec.loaders.profiles_root() prefers this packaged
# copy and falls back to the repo checkout for `uv run` development sessions.
[tool.hatch.build.targets.wheel.force-include]
"profiles" = "bwz/profiles"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Docstrings state formulas per CLAUDE.md style ("2·M·N·K", "3.35 × 1e12", "µs").
allowed-confusables = ["×", "·", "µ", "—", "≈", "≤", "≥"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI arguments as function defaults; that is the framework's API,
# not an accidental mutable default.
"bwz/cli.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["bwz", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "validation: predicted-vs-published validation suite (slow, network-sourced references)",
    "slow: long-running tests",
]
