# Publishes notebook/ (the matmul and attention decks and interactive notebooks) to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Site: https://davideschiavone.github.io/bandwidth-zen/
name: pages

on:
  push:
    branches: [main]
    paths: ["notebook/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: notebook
      - id: deployment
        uses: actions/deploy-pages@v4
