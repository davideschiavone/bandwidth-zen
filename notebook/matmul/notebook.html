<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Matmul Rearranged Notebook</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"><style>/* Layout concept: every picture is the textbook matmul layout — B on top, A on the left, C where row i meets column j. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eaeef4;
  --fg: #18202b;
  --muted: #5b6676;
  --line: #d3dae4;
  --a: #2360c8;          /* A — blue   */
  --b: #d9730a;          /* B — orange */
  --c: #148552;          /* C — green  */
  --cp: #c9ecd8;         /* C partial — pale green */
  --sp: #a8329a;         /* additions across cores (space) — magenta */
  --mem: #6a4bc4;        /* trips through memory — violet */
  --on-strong: #ffffff;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --cell: 2.1rem;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #191f28; --surface-2: #222a35; --fg: #e8edf4; --muted: #9aa6b7; --line: #323c4a;
    --a: #6a9eff; --b: #ffa347; --c: #3cc986; --cp: #1f4a35; --sp: #e27ad6; --mem: #a993ff; --on-strong: #0b0f14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #191f28; --surface-2: #222a35; --fg: #e8edf4; --muted: #9aa6b7; --line: #323c4a;
  --a: #6a9eff; --b: #ffa347; --c: #3cc986; --cp: #1f4a35; --sp: #e27ad6; --mem: #a993ff; --on-strong: #0b0f14;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); }

.ta { color: var(--a); font-weight: 600; }
.tb { color: var(--b); font-weight: 600; }
.tc { color: var(--c); font-weight: 600; }
.tsp { color: var(--sp); font-weight: 600; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }

/* ---------- matrices ---------- */
.triple { display: grid; grid-template-columns: auto auto; grid-template-areas: "x b" "a c"; gap: 0.6rem 0.8rem; align-items: end; justify-items: start; }
.triple > .m-A { grid-area: a; align-self: start; justify-self: end; }
.triple > .m-B { grid-area: b; }
.triple > .m-C { grid-area: c; align-self: start; }
.triple > .tx { grid-area: x; align-self: end; justify-self: end; color: var(--muted); font-family: var(--font-mono); font-size: 0.78rem; text-align: right; line-height: 1.3; }
.mat { display: flex; flex-direction: column; gap: 0.25rem; }
.mat-title { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); display: flex; gap: 0.35rem; align-items: baseline; }
.mat-title b { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; }
.m-A .mat-title b { color: var(--a); } .m-B .mat-title b { color: var(--b); } .m-C .mat-title b { color: var(--c); }
.mat-grid { display: grid; gap: 3px; position: relative; }
.mh { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); display: grid; place-items: center; min-width: 1rem; border-radius: 3px; }
.mh.on { background: var(--fg); color: var(--bg); }
.mh.corner { font-size: 0.62rem; opacity: 0.8; }
.cell { width: var(--cell); height: var(--cell); display: grid; place-items: center; border-radius: 4px; font-family: var(--font-mono); font-weight: 600; font-size: 0.92rem; font-variant-numeric: tabular-nums; border: 1.5px solid transparent; transition: background-color .18s, color .18s, box-shadow .18s, border-color .18s; position: relative; }
.cell.bl { margin-left: 5px; } .cell.bt { margin-top: 5px; }
.mh.bl { margin-left: 5px; } .mh.bt { margin-top: 5px; }
/* A */
.k-A { background: color-mix(in oklab, var(--a) 11%, var(--surface)); color: var(--fg); }
.k-A.sweep { background: color-mix(in oklab, var(--a) 30%, var(--surface)); }
.k-A.read { background: var(--a); color: var(--on-strong); }
/* B */
.k-B { background: color-mix(in oklab, var(--b) 12%, var(--surface)); color: var(--fg); }
.k-B.sweep { background: color-mix(in oklab, var(--b) 32%, var(--surface)); }
.k-B.read { background: var(--b); color: var(--on-strong); }
/* C */
.k-C { background: var(--surface); border: 1.5px dashed var(--line); color: var(--muted); }
.k-C.sweep { border-color: color-mix(in oklab, var(--c) 60%, var(--line)); border-style: solid; }
.k-C.part { background: var(--cp); color: var(--fg); border: 1.5px solid color-mix(in oklab, var(--c) 45%, transparent); }
.k-C.fin { background: var(--c); color: var(--on-strong); border: 1.5px solid var(--c); }
.k-C.write { box-shadow: 0 0 0 2.5px var(--fg); }
.k-C.spadd { box-shadow: 0 0 0 3px var(--sp); }
.cell.stay { z-index: 1; }
.k-A.stay { box-shadow: 0 0 0 3px var(--a), 0 0 12px 3px color-mix(in oklab, var(--a) 55%, transparent); }
.k-B.stay { box-shadow: 0 0 0 3px var(--b), 0 0 12px 3px color-mix(in oklab, var(--b) 55%, transparent); }
.k-C.stay { box-shadow: 0 0 0 3px var(--c), 0 0 12px 3px color-mix(in oklab, var(--c) 55%, transparent); }
.cell.dim { opacity: 0.35; }
.badge { pointer-events: none; border: 2px solid var(--fg); border-radius: 6px; position: relative; opacity: 0.85; }
.badge span { position: absolute; top: -0.62rem; left: 0.2rem; background: var(--fg); color: var(--bg); font-family: var(--font-mono); font-size: 0.6rem; padding: 0 0.28rem; border-radius: 3px; line-height: 1.1rem; white-space: nowrap; }
.badge.soft { border-style: dashed; opacity: 0.55; }
.badge.lit { border-color: var(--sp); } .badge.lit span { background: var(--sp); }

/* ---------- code ---------- */
.code { font-family: var(--font-mono); font-size: 0.84rem; line-height: 1.55; background: var(--surface-2); border-radius: var(--radius); padding: 0.6rem 0.2rem; margin: 0; overflow-x: auto; min-width: 0; }
.code .ln { padding: 0 0.7rem; white-space: pre; border-left: 3px solid transparent; }
.code .ln.inner { background: color-mix(in oklab, var(--fg) 5%, transparent); }
.code .ln.on { background: color-mix(in oklab, var(--c) 22%, transparent); border-left-color: var(--c); }
.code .kw { color: var(--muted); }
.code .val { color: var(--bg); background: var(--fg); border-radius: 3px; padding: 0 0.3rem; margin-left: 0.6rem; font-size: 0.75rem; }
.code .cm { color: var(--muted); font-style: italic; }

/* ---------- widget chrome ---------- */
.w { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem; display: flex; flex-direction: column; gap: 0.7rem; min-width: 0; }
.w:focus-visible { outline: 3px solid var(--a); outline-offset: 2px; }
.w-head { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.w-title { font-family: var(--font-display); font-weight: 700; font-size: 1rem; margin-right: 0.3rem; }
.chip { font-family: var(--font-mono); font-size: 0.72rem; padding: 0.12rem 0.5rem; border-radius: 99px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
.chip.A { box-shadow: inset 0 0 0 2px var(--a); } .chip.B { box-shadow: inset 0 0 0 2px var(--b); } .chip.C { box-shadow: inset 0 0 0 2px var(--c); }
.w-body { display: flex; flex-wrap: wrap; gap: 1rem 1.4rem; align-items: flex-start; }
.w-body > * { min-width: 0; }
.cap { font-size: 0.9rem; min-height: 2.6em; line-height: 1.45; color: var(--fg); }
.cap code { background: var(--surface-2); padding: 0 0.25rem; border-radius: 3px; }
.cap .ok { color: var(--c); font-weight: 700; }
.w-foot { display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center; justify-content: space-between; }
.counters { display: flex; flex-wrap: wrap; gap: 0.35rem 0.9rem; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.counters b { color: var(--fg); font-weight: 600; }
.counters .csp b { color: var(--sp); }
.controls { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.btn { font: 600 0.78rem var(--font-body); background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 0.3rem 0.6rem; cursor: pointer; }
.btn:hover { border-color: var(--fg); }
.btn:focus-visible { outline: 2px solid var(--a); outline-offset: 1px; }
.btn.pri { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 0.25rem; }
.reg { font-family: var(--font-mono); font-size: 0.82rem; display: flex; align-items: center; gap: 0.5rem; }
.reg .box { min-width: 3rem; text-align: center; padding: 0.25rem 0.5rem; border-radius: 6px; border: 2px solid var(--c); font-weight: 700; font-size: 1.05rem; }
.stack { display: flex; flex-direction: column; gap: 0.6rem; min-width: 0; }
.pgroup { display: grid; grid-template-columns: repeat(auto-fit, minmax(15.5rem, 1fr)); gap: 0.8rem; }
.pgroup .w { padding: 0.6rem; }
.compact { --cell: 1.55rem; }
.compact .cell { font-size: 0.74rem; }
.compact .code { font-size: 0.7rem; padding: 0.35rem 0; }

/* core panels, timelines */
.cores { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 0.5rem; }
.core { border: 1px solid var(--line); border-radius: 8px; padding: 0.45rem 0.55rem; display: flex; flex-direction: column; gap: 0.35rem; background: var(--bg); min-width: 0; }
.core h5 { margin: 0; font: 700 0.8rem var(--font-display); display: flex; justify-content: space-between; gap: 0.4rem; }
.core .op { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); min-height: 1.1rem; }
.core.idle { background: repeating-linear-gradient(45deg, var(--surface-2) 0 6px, var(--bg) 6px 12px); }
.core.spent { opacity: 0.5; }
.mini { display: grid; gap: 2px; --cell: 1.35rem; }
.mini .cell { font-size: 0.68rem; }
.tl-wrap { overflow-x: auto; }
table.tl { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.72rem; }
table.tl th, table.tl td { border: 1px solid var(--line); padding: 0.25rem 0.45rem; text-align: center; white-space: nowrap; }
table.tl th { color: var(--muted); font-weight: 500; }
table.tl td.now { background: color-mix(in oklab, var(--c) 20%, transparent); }
table.tl td.done { color: var(--muted); }
table.tl td.idle { background: repeating-linear-gradient(45deg, var(--surface-2) 0 5px, transparent 5px 10px); color: var(--muted); }
table.tl td.red { color: var(--sp); font-weight: 600; }
table.tl td.red.now { background: color-mix(in oklab, var(--sp) 18%, transparent); }

/* hardware pictures */
.hw { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
.node { width: 2.4rem; height: 2.4rem; border-radius: 50%; display: grid; place-items: center; font: 700 1.1rem var(--font-mono); border: 2px solid var(--fg); background: var(--surface); }
.pill { font-family: var(--font-mono); font-weight: 600; padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.85rem; }
.pill.A { background: var(--a); color: var(--on-strong); } .pill.B { background: var(--b); color: var(--on-strong); }
.pill.C { background: var(--c); color: var(--on-strong); } .pill.Cp { background: var(--cp); color: var(--fg); }
.arrow { color: var(--muted); font-size: 1.2rem; }
.imc { display: grid; gap: 3px; align-items: center; justify-items: center; }
.imc .drv { font-family: var(--font-mono); font-size: 0.72rem; }
.imc .lab { font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); }
.unit { border: 2px solid var(--fg); border-radius: 10px; padding: 0.5rem 0.7rem; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
.unit-lab { font: 700 0.75rem var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.terms { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.term { font-family: var(--font-mono); font-size: 0.74rem; padding: 0.2rem 0.4rem; border-radius: 5px; border: 1px dashed var(--line); color: var(--muted); }
.term.done { border: 1px solid var(--c); color: var(--fg); background: var(--cp); }
.term.now { border: 2px solid var(--fg); color: var(--fg); }
.red-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; font-family: var(--font-mono); font-size: 0.8rem; }
.red-node { border: 2px solid var(--sp); color: var(--sp); border-radius: 6px; padding: 0.2rem 0.45rem; font-weight: 600; }
.red-node.todo { border-style: dashed; opacity: 0.5; }
table.mini-tab { border-collapse: collapse; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
table.mini-tab th, table.mini-tab td { border-bottom: 1px solid var(--line); padding: 0.3rem 0.6rem; text-align: right; }
table.mini-tab th:first-child, table.mini-tab td:first-child { text-align: left; }
table.mini-tab tr.cur td { background: color-mix(in oklab, var(--fg) 7%, transparent); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .cell { transition: none; } }
@media (max-width: 520px) { :root { --cell: 1.75rem; } .compact { --cell: 1.4rem; } }

/* ---------- multi-core view ---------- */
.pv { gap: 0.85rem; }
.pv-top { display: flex; flex-wrap: wrap; gap: 1rem 1.6rem; align-items: flex-start; }
.pv-top > .stack { flex: 1 1 18rem; }
.pv-lab { font: 700 0.72rem var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: -0.35rem; }
.chip.sp { box-shadow: inset 0 0 0 2px var(--sp); color: var(--sp); }
.legend { display: flex; flex-wrap: wrap; gap: 0.35rem 0.9rem; font-size: 0.74rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
.lg { width: 0.9rem; height: 0.9rem; border-radius: 3px; display: inline-block; }
.lg.read { background: linear-gradient(90deg, var(--a) 50%, var(--b) 50%); }
.lg.stay { background: var(--surface); box-shadow: 0 0 0 2px var(--fg), 0 0 6px 2px color-mix(in oklab, var(--fg) 40%, transparent); }
.lg.part { background: var(--cp); }
.lg.fin { background: var(--c); }
.lg.scat { background: repeating-linear-gradient(45deg, color-mix(in oklab, var(--sp) 30%, var(--surface)) 0 3px, var(--surface) 3px 6px); border: 1.5px dashed var(--sp); }
.k-C.scat { background: repeating-linear-gradient(45deg, color-mix(in oklab, var(--sp) 22%, var(--surface)) 0 4px, var(--surface) 4px 8px); border: 1.5px dashed var(--sp); color: var(--sp); font-size: 0.72rem; }
.cell.hov { outline: 2.5px dashed var(--fg); outline-offset: 1px; z-index: 2; }
.badge.tag { border: 2px solid var(--fg); opacity: 1; }
.badge.tag span { top: auto; bottom: -0.55rem; left: auto; right: -0.2rem; font-size: 0.58rem; line-height: 0.95rem; z-index: 3; }
.floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 0.6rem; padding: 0.6rem; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.corebox { background: var(--surface); border: 2px solid var(--fg); border-radius: 9px; padding: 0.5rem 0.6rem; display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; min-height: 5.5rem; }
.corebox h5 { margin: 0; font: 700 0.85rem var(--font-display); display: flex; justify-content: space-between; gap: 0.5rem; }
.corebox .muted, .muted { color: var(--muted); font-weight: 500; font-family: var(--font-mono); font-size: 0.7rem; }
.corebox .op { font-size: 0.78rem; color: var(--muted); }
.corebox.idle { border-style: dashed; border-color: var(--line); background: repeating-linear-gradient(45deg, var(--surface-2) 0 7px, var(--surface) 7px 14px); }
.cb-row { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
.cb-blk { display: flex; flex-direction: column; gap: 0.15rem; }
.cb-l { font: 500 0.62rem var(--font-mono); color: var(--muted); white-space: nowrap; }
.corebox .mini { --cell: 1.25rem; }
.corebox .mini .cell { font-size: 0.64rem; border-radius: 3px; }
.gantt-wrap { overflow-x: auto; padding-bottom: 0.2rem; }
.gantt { display: grid; gap: 4px 3px; align-items: stretch; position: relative; min-width: min-content; }
.g-wave { font: 700 0.72rem var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; text-align: center; padding: 0.2rem; border-bottom: 2px solid var(--fg); }
.g-wave.sp { color: var(--sp); border-bottom-color: var(--sp); }
.g-num { font: 500 0.62rem var(--font-mono); color: var(--muted); text-align: center; }
.g-lab { font: 600 0.72rem var(--font-mono); display: flex; align-items: center; }
.g-lab.sp { color: var(--sp); }
.g-band { background: color-mix(in oklab, var(--fg) 4%, transparent); border-radius: 6px; }
.g-band.alt { background: color-mix(in oklab, var(--fg) 9%, transparent); }
.bar { position: relative; height: 2.1rem; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin: 0 2px; cursor: default; }
.bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; transition: width .25s; }
.bar .bt { position: relative; font: 600 0.7rem var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 0.3rem; }
.bar.f-os { background: color-mix(in oklab, var(--c) 18%, var(--surface)); } .bar.f-os .fill { background: color-mix(in oklab, var(--c) 55%, var(--surface)); }
.bar.f-ws { background: color-mix(in oklab, var(--b) 18%, var(--surface)); } .bar.f-ws .fill { background: color-mix(in oklab, var(--b) 55%, var(--surface)); }
.bar.f-is { background: color-mix(in oklab, var(--a) 18%, var(--surface)); } .bar.f-is .fill { background: color-mix(in oklab, var(--a) 50%, var(--surface)); }
.bar.idle { background: repeating-linear-gradient(45deg, var(--surface-2) 0 6px, var(--surface) 6px 12px); border: 1.5px dashed var(--line); color: var(--muted); }
.bar.red { background: color-mix(in oklab, var(--sp) 14%, var(--surface)); color: var(--sp); } .bar.red .fill { background: color-mix(in oklab, var(--sp) 40%, var(--surface)); }
.bar.now { box-shadow: 0 0 0 2px var(--fg); }
.bar.hovme { box-shadow: 0 0 0 3px var(--fg); }
.bar.sib { box-shadow: 0 0 0 3px var(--sp); }
.bar:focus-visible { outline: 3px solid var(--a); }
.g-cursor { border: 2px solid var(--fg); border-radius: 6px; pointer-events: none; z-index: 2; background: color-mix(in oklab, var(--fg) 6%, transparent); }
.scrub { display: flex; align-items: center; gap: 0.5rem; font: 500 0.72rem var(--font-mono); color: var(--muted); }
.scrub input { flex: 1; min-width: 8rem; accent-color: var(--c); }
.w-foot .right { align-items: stretch; flex: 0 1 auto; }
.pv-knobs { display: flex; flex-wrap: wrap; gap: 0.5rem 1.2rem; }
.seg-l { font: 600 0.72rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); align-self: center; margin-right: 0.2rem; }
.triple.dense { --cell: 1.6rem; }
.triple.dense .cell { font-size: 0.72rem; }
.compact .floor { grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); }

/* ---------- split-K memory + weight sets ---------- */
.tm { color: var(--mem); font-weight: 600; }
.chip.mem { box-shadow: inset 0 0 0 2px var(--mem); color: var(--mem); }
.counters .cmem b { color: var(--mem); }
.lg.memw { background: var(--cp); box-shadow: 0 0 0 2px var(--mem); }
.lg.memr { background: var(--surface); box-shadow: 0 0 0 2px var(--mem); border: 1px dashed var(--mem); }
.lg.load { background: color-mix(in oklab, var(--b) 18%, var(--surface)); border: 1.5px dashed var(--b); }
.k-C.memw { box-shadow: 0 0 0 2.5px var(--mem); }
.k-C.memr { box-shadow: 0 0 0 2.5px var(--mem), 0 0 10px 2px color-mix(in oklab, var(--mem) 45%, transparent); }
.membox { display: flex; flex-wrap: wrap; gap: 1rem 1.6rem; padding: 0.7rem 0.8rem; border-radius: 12px; border: 2px solid var(--mem); background: color-mix(in oklab, var(--mem) 6%, var(--surface)); }
.membox .mat-title b { color: var(--mem); }
.bar.mem { background: color-mix(in oklab, var(--mem) 14%, var(--surface)); color: var(--mem); } .bar.mem .fill { background: color-mix(in oklab, var(--mem) 35%, var(--surface)); }

<body>
<header class="lab-head"><p class="eyebrow">Interactive notebook · pick a chapter, then turn the knobs</p><h1>Matmul, rearranged</h1><span class="formula"><span class="ta">A</span>[M, K] @ <span class="tb">B</span>[K, N] → <span class="tc">C</span>[M, N]</span></header><nav class="chapters" id="chapters" aria-label="Chapters"></nav><div class="lab"><aside class="knobs" id="knobs" aria-label="Knobs"></aside><main class="labmain"><section class="story" id="story"></section><div class="rule" id="rule"></div><div id="view"></div><details class="console" id="tracebox" open><summary>Printed steps — the same run as text</summary><pre id="trace"></pre></details></main></div><script>/* General matmul simulator: any M, N, K (up to 8), any tiling, any loop order, any number of cores.
   Used by the lab page and by the multi-core slides of the deck. Every view replays from scratch,
   so the counters are always the real ones. */
(function (global) {
  'use strict';
  const rng = (n) => Array.from({ length: n }, (_, i) => i);
  const zeros = (r, c) => rng(r).map(() => rng(c).map(() => 0));
  const EXA = [[1, 2, 0, 3], [0, 1, 2, 1], [3, 0, 1, 2], [2, 1, 3, 0]];
  const EXB = [[2, 0, 1, 3], [1, 3, 0, 2], [0, 1, 2, 1], [3, 2, 1, 0]];
  const STAY = { k: 'C', i: 'B', j: 'A' };
  const SHORT = { C: 'os', B: 'ws', A: 'is' };
  const STATN = { C: 'output-stationary', B: 'weight-stationary', A: 'input-stationary' };
  const FORM = { ijk: 'inner product', jik: 'inner product', ikj: 'row-wise (Gustavson)', jki: 'column-wise', kij: 'outer product', kji: 'outer product' };
  const BV = { i: 'mt', j: 'nt', k: 'kt' };
  const DIM = { i: 'M', j: 'N', k: 'K' };
  const IDX = { A: ['i', 'k'], B: ['k', 'j'], C: ['i', 'j'] };
  const ORDERS = ['ijk', 'jik', 'ikj', 'kij', 'jki', 'kji'];
  const key = (i, j) => i + ',' + j;

  function lcg(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); }
  function problem(M, N, K, seed) {
    let A, B;
    if (!seed && M === 4 && N === 4 && K === 4) { A = EXA.map((r) => r.slice()); B = EXB.map((r) => r.slice()); }
    else {
      const r = lcg(seed || 7);
      A = rng(M).map(() => rng(K).map(() => Math.floor(r() * 4)));
      B = rng(K).map(() => rng(N).map(() => Math.floor(r() * 4)));
    }
    const REF = rng(M).map((i) => rng(N).map((j) => rng(K).reduce((s, k) => s + A[i][k] * B[k][j], 0)));
    return { M, N, K, A, B, REF, seed: seed || 0 };
  }
  const divisors = (n) => rng(n).map((x) => x + 1).filter((d) => n % d === 0);
  function newAcc(P) { return { C: zeros(P.M, P.N), T: zeros(P.M, P.N), mul: 0, add: 0, part: 0, maxPart: 0 }; }
  function apply(P, s, i, j, k) {
    const a = P.A[i][k], b = P.B[k][j], p = a * b, old = s.C[i][j], first = s.T[i][j] === 0;
    if (!first) s.add++;
    s.C[i][j] = old + p; s.T[i][j]++; s.mul++;
    if (first && P.K > 1) s.part++;
    if (s.T[i][j] === P.K && P.K > 1) s.part--;
    if (s.part > s.maxPart) s.maxPart = s.part;
    return { i, j, k, a, b, p, old, nw: old + p, terms: s.T[i][j], first };
  }
  function eqRef(P, C) { return C.every((r, i) => r.every((x, j) => x === P.REF[i][j])); }

  // ---------------- DOM helpers ----------------
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function btn(label, title, fn, pri) { const b = el('button', 'btn' + (pri ? ' pri' : ''), label); b.type = 'button'; b.title = title; b.setAttribute('aria-label', title); b.addEventListener('click', fn); return b; }
  function addCls(map, k0, c) { map[k0] = map[k0] ? map[k0] + ' ' + c : c; }
  function counters(items) { return items.map((x) => '<span class="' + (x.cls || '') + '">' + x.label + ' <b>' + x.value + '</b></span>').join(''); }

  function Mat(kind, rows, cols, opt) {
    opt = opt || {};
    this.rows = rows; this.cols = cols; this.rb = opt.rb || rows; this.cb = opt.cb || cols;
    this.root = el('div', 'mat m-' + kind + (opt.cls ? ' ' + opt.cls : ''));
    const rv = opt.rv || IDX[kind][0], cv = opt.cv || IDX[kind][1];
    this.root.appendChild(el('div', 'mat-title', '<b>' + (opt.title || kind) + '</b><span>' + (opt.dims || rows + '×' + cols) + '</span>'));
    const g = el('div', 'mat-grid'); g.style.gridTemplateColumns = 'auto repeat(' + cols + ', auto)'; this.grid = g;
    const put = (e, r, c) => { e.style.gridRow = String(r); e.style.gridColumn = String(c); g.appendChild(e); return e; };
    put(el('div', 'mh corner', rv + '\\' + cv), 1, 1);
    this.colH = []; this.rowH = []; this.cells = [];
    const bl = (c) => (this.cb < this.cols && c % this.cb === 0 && c > 0 ? ' bl' : '');
    const bt = (r) => (this.rb < this.rows && r % this.rb === 0 && r > 0 ? ' bt' : '');
    for (let c = 0; c < cols; c++) { const h = el('div', 'mh' + bl(c), String(c)); this.colH.push(h); put(h, 1, c + 2); }
    for (let r = 0; r < rows; r++) {
      const h = el('div', 'mh' + bt(r), String(r)); this.rowH.push(h); put(h, r + 2, 1);
      const row = [];
      for (let c = 0; c < cols; c++) {
        const x = el('div', 'cell'); x.dataset.base = 'cell k-' + kind + bl(c) + bt(r); x.className = x.dataset.base;
        if (opt.vals) x.textContent = opt.vals[r][c];
        row.push(x); put(x, r + 2, c + 2);
      }
      this.cells.push(row);
    }
    this.badges = []; this.root.appendChild(g);
  }
  Mat.prototype.paint = function (cls, text) {
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      const x = this.cells[r][c], ex = cls[key(r, c)] || '', want = x.dataset.base + (ex ? ' ' + ex : '');
      if (x.className !== want) x.className = want;
      if (text) { const t = text(r, c); if (x.textContent !== t) x.textContent = t; }
    }
  };
  Mat.prototype.heads = function (rs, cs) {
    this.rowH.forEach((h, r) => h.classList.toggle('on', !!rs && rs.indexOf(r) >= 0));
    this.colH.forEach((h, c) => h.classList.toggle('on', !!cs && cs.indexOf(c) >= 0));
  };
  Mat.prototype.badge = function (r0, c0, rs, cs, text, cls) {
    const b = el('div', 'badge' + (cls ? ' ' + cls : ''), text ? '<span>' + text + '</span>' : '');
    b.style.gridRow = (2 + r0) + ' / span ' + rs; b.style.gridColumn = (2 + c0) + ' / span ' + cs;
    this.grid.appendChild(b); this.badges.push(b); return b;
  };
  Mat.prototype.clearBadges = function () { this.badges.forEach((b) => b.remove()); this.badges = []; };

  function Triple(P, t, note) {
    this.root = el('div', 'triple');
    const big = Math.max(P.M, P.N, P.K);
    if (big > 6) this.root.classList.add('dense');
    this.A = new Mat('A', P.M, P.K, { vals: P.A, rb: t.tm, cb: t.tk, dims: P.M + '×' + P.K + ' (M×K)' });
    this.B = new Mat('B', P.K, P.N, { vals: P.B, rb: t.tk, cb: t.tn, dims: P.K + '×' + P.N + ' (K×N)' });
    this.C = new Mat('C', P.M, P.N, { rb: t.tm, cb: t.tn, dims: P.M + '×' + P.N + ' (M×N)' });
    this.root.append(el('div', 'tx', note || 'C = A @ B'), this.B.root, this.A.root, this.C.root);
  }

  // ---------------- stepping mixin ----------------
  const Step = {
    step() { if (this.t < this.n) { this.go(this.t + 1); return true; } return false; },
    back() { if (this.t > 0) { this.go(this.t - 1); return true; } return false; },
    finish() { this.stop(); if (this.t < this.n) { this.go(this.n); return true; } return false; },
    reset() { this.stop(); this.go(0); },
    atEnd() { return this.t >= this.n; },
    atStart() { return this.t <= 0; },
    play() {
      if (this.timer) { this.stop(); return; }
      if (this.t >= this.n) this.go(0);
      this.timer = setInterval(() => { if (!this.step()) this.stop(); }, this.speed());
      this.syncPlay();
    },
    stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } this.syncPlay(); },
    syncPlay() { if (this.playBtn) { this.playBtn.textContent = this.timer ? 'Pause' : 'Play'; this.playBtn.setAttribute('aria-pressed', this.timer ? 'true' : 'false'); } },
    speed() { const s = this.cfg.speed || 1; return Math.max(40, Math.round(this.baseSpeed / s)); },
    go(t) { this.t = Math.max(0, Math.min(this.n, t)); this.render(); if (this.scrub) { this.scrub.max = this.n; this.scrub.value = this.t; } if (this.cfg.onStep) this.cfg.onStep(this); },
    controls(innerLabel) {
      const c = el('div', 'controls');
      c.append(btn('Reset', 'Reset (R)', () => this.reset()), btn('◀', 'Step back (←)', () => { this.stop(); this.back(); }), btn('Step ▶', 'One step (→)', () => { this.stop(); this.step(); }, true));
      if (innerLabel) c.append(btn(innerLabel, 'Bigger jump (↓)', () => { this.stop(); this.inner(); }));
      this.playBtn = btn('Play', 'Play / pause (P)', () => this.play());
      c.append(this.playBtn, btn('Finish', 'Jump to the end (E)', () => this.finish()));
      return c;
    },
    scrubber() {
      const w = el('label', 'scrub'); w.innerHTML = '<span>time</span>';
      const r = el('input'); r.type = 'range'; r.min = 0; r.max = this.n; r.value = 0; r.id = 'scrub-' + Math.random().toString(36).slice(2, 8);
      r.addEventListener('input', () => { this.stop(); this.go(+r.value); });
      w.appendChild(r); this.scrub = r; return w;
    },
    keydown(e) {
      const k = e.key;
      if (k === 'ArrowRight') { this.stop(); return this.step(); }
      if (k === 'ArrowLeft') { this.stop(); return this.back(); }
      if (k === 'ArrowDown') { this.stop(); return this.inner(); }
      if (k === 'p' || k === 'P') { this.play(); return true; }
      if (k === 'e' || k === 'E') return this.finish();
      if (k === 'r' || k === 'R') { this.reset(); return true; }
      return false;
    },
    keys() { this.root.tabIndex = 0; this.root.addEventListener('keydown', (e) => { if (e.target !== this.root) return; if (this.keydown(e)) e.preventDefault(); }); },
    destroy() { this.stop(); }
  };
  function mix(P) { Object.keys(Step).forEach((k) => { if (!P[k]) P[k] = Step[k]; }); }

  // =====================================================================
  // Single core
  // cfg: P, tiled, tm, tn, tk, border ('ijk' letters for mt nt kt), inner, gran ('op'|'inner'|'block')
  // =====================================================================
  function singlePlan(P, cfg) {
    const T = cfg.tiled ? { i: cfg.tm, j: cfg.tn, k: cfg.tk } : { i: P.M, j: P.N, k: P.K };
    const nb = { i: P.M / T.i, j: P.N / T.j, k: P.K / T.k };
    const bo = cfg.tiled ? cfg.border : 'ijk', io = cfg.inner;
    const ops = []; let blk = 0, bgrp = 0, igrp = 0;
    for (let a0 = 0; a0 < nb[bo[0]]; a0++) for (let a1 = 0; a1 < nb[bo[1]]; a1++) {
      for (let a2 = 0; a2 < nb[bo[2]]; a2++) {
        const bid = {}; bid[bo[0]] = a0; bid[bo[1]] = a1; bid[bo[2]] = a2;
        for (let s0 = 0; s0 < T[io[0]]; s0++) for (let s1 = 0; s1 < T[io[1]]; s1++) {
          for (let s2 = 0; s2 < T[io[2]]; s2++) {
            const sid = {}; sid[io[0]] = s0; sid[io[1]] = s1; sid[io[2]] = s2;
            ops.push({ i: bid.i * T.i + sid.i, j: bid.j * T.j + sid.j, k: bid.k * T.k + sid.k, bid, sid, blk, bgrp, igrp });
          }
          igrp++;
        }
        blk++;
      }
      bgrp++;
    }
    const field = cfg.gran === 'block' ? 'blk' : cfg.gran === 'inner' ? 'igrp' : null;
    const ends = [];
    ops.forEach((o, x) => { if (!field || x === ops.length - 1 || ops[x + 1][field] !== o[field]) ends.push(x + 1); });
    return { T, nb, bo, io, ops, ends };
  }

  function singleCode(P, cfg, pl) {
    const L = [];
    const ind = (d) => '  '.repeat(d);
    if (cfg.tiled) {
      pl.bo.split('').forEach((v, d) => L.push({ v: 'b' + v, html: ind(d) + '<span class="kw">for</span> ' + BV[v] + ' <span class="kw">in</span> range(' + pl.nb[v] + '):' + (d === 0 ? '<span class="cm">   # block loops</span>' : '') }));
      pl.io.split('').forEach((v, d) => L.push({ v: 's' + v, html: ind(d + 3) + '<span class="kw">for</span> ' + v + ' <span class="kw">in</span> block(' + BV[v] + '):' + (d === 0 ? '<span class="cm">   # inside one block product</span>' : '') }));
      L.push({ v: 'body', html: ind(6) + '<span class="tc">C</span>[i][j] += <span class="ta">A</span>[i][k] * <span class="tb">B</span>[k][j]' });
    } else {
      pl.io.split('').forEach((v, d) => L.push({ v: 's' + v, html: ind(d) + '<span class="kw">for</span> ' + v + ' <span class="kw">in</span> range(' + DIM[v] + '):' }));
      L.push({ v: 'body', html: ind(3) + '<span class="tc">C</span>[i][j] += <span class="ta">A</span>[i][k] * <span class="tb">B</span>[k][j]' });
    }
    return L;
  }

  function SingleView(root, cfg) {
    this.cfg = cfg; this.root = root; this.P = cfg.P; root.classList.add('w');
    this.pl = singlePlan(this.P, cfg); this.n = this.pl.ends.length; this.t = 0;
    this.baseSpeed = cfg.gran === 'block' ? 700 : cfg.gran === 'inner' ? 500 : 260;
    const bodyEl = el('div', 'w-body'); root.appendChild(bodyEl);
    const left = el('div', 'stack'); bodyEl.appendChild(left);

</script><script>/* Interactive notebook: knobs + chapters that mirror the deck. */
(function () {
  'use strict';
  const X = window.MM2;
  const DEF = { M: 4, N: 4, K: 4, seed: 0, mode: 'single', tiled: false, tm: 2, tn: 2, tk: 2, border: 'ijk', inner: 'ijk', gran: 'op', cores: 4, flow: 'os', g: 1, S: 1, pieces: 2, slots: 2, load: 2, sched: 'overlap', group: 'block', both: true, speed: 1 };
  const S = Object.assign({}, DEF);
  const $ = (id) => document.getElementById(id);
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const BVn = (o) => o.split('').map((v) => X.BV[v]).join(' ');

  const CH = [
    { id: 'textbook', t: 'Textbook loop', set: {}, s: '<h2>The loop you already know</h2><p>For each row i and column j, walk along k and add up the products. Every C value is started, finished and never touched again. During the whole k loop the running sum stays put, so this is the <b>inner-product form</b>, also called <b>output-stationary (os)</b>.</p><p class="try">Try: press <b>Bigger jump</b> to finish one C value per click.</p>' },
    { id: 'rule', t: 'What stays put', set: { inner: 'jki' }, s: '<h2>The one rule</h2><p>Each operand uses two of the three letters: A[i][k], B[k][j], C[i][j]. The innermost loop changes one letter every step. The operand that does not contain it <b>stays put</b> (it glows).</p><p class="try">Try: change <b>Loop order</b>. Ends in k → C glows (os). Ends in i → B glows (ws). Ends in j → A glows (is).</p>' },
    { id: 'row', t: 'Row-wise', set: { inner: 'ikj', gran: 'inner' }, s: '<h2>Row-wise (Gustavson), ikj</h2><p>One A value is kept while a whole row of B streams past; the results are added into a row of C. One step here is a whole inner loop: <code>C[i,:] += A[i][k] * B[k,:]</code>. A stays put: <b>input-stationary</b>.</p>' },
    { id: 'col', t: 'Column-wise', set: { inner: 'jki', gran: 'inner' }, s: '<h2>Column-wise, jki</h2><p>One B value is kept while a column of A streams past: <code>C[:,j] += A[:,k] * B[k][j]</code>. B stays put: <b>weight-stationary</b>.</p>' },
    { id: 'outer', t: 'Outer product', set: { inner: 'kij', gran: 'inner' }, s: '<h2>Outer product, kij / kji</h2><p>k is outermost. For each k, column k of A times row k of B is added into <b>all</b> of C (a <b>rank-1 update</b>). Every C value stays pale until the last k.</p><p class="try">Try: watch <b>most partial at once</b> — it reaches 16, the whole of C.</p>' },
    { id: 'partial', t: 'Partial sums', set: { inner: 'kij' }, s: '<h2>Accumulating over time</h2><p>Outside the inner-product form, a C value gets one term per visit and waits, pale, in <b>one place</b> while it is added to at <b>many moments</b>. That is <b>accumulating over time</b>. The counter <b>most partial at once</b> is how many such waiting values you must store: 1 for ijk, a row for ikj, a column for jki, all of C for kij.</p><p class="try">Try: switch Loop order between ijk, ikj, kij and compare the counter at the end.</p>' },
    { id: 'tile', t: 'Tiling', set: { tiled: true, gran: 'block' }, s: '<h2>Tiling: the same thing, in chunks</h2><p>Cut every matrix into blocks. The block loops <b>mt, nt, kt</b> run in any of the 6 orders, and each step is a small block product. The rule works one level up: innermost kt → the C block stays put, and so on.</p><p class="try">Try: change <b>Block loop order</b> and the tile sizes, or make the matrices 8×8.</p>' },
    { id: 'open', t: 'One block, opened', set: { tiled: true, gran: 'op' }, s: '<h2>Inside a block product</h2><p>Set the step to <b>1 multiply</b> with tiling on: each block product is just the textbook loop on a small piece. The dashed outlines mark the current block of A, B and C.</p>' },
    { id: 'hw', t: 'Hardware step size', set: { tiled: true, gran: 'inner', inner: 'kij' }, s: '<h2>How big is one step?</h2><p>The loops do not change; the hardware decides how many happen at once. <b>1 multiply</b> is a CPU core. <b>1 inner loop</b> is a vector operation, like a row of A pushed through a block of B stored in an in-memory-compute array (real Metis figure you gave: 512×512). <b>1 block product</b> is a GPU tensor core (real: 16×16 @ 16×16 per warp-level operation).</p>' },
    { id: 'os', t: 'Cores: grid & sweep', set: { mode: 'many', flow: 'os' }, s: '<h2>Several cores: grid and sweep</h2><p>Two block loops are shared out over the cores and run at the same time — the <b>tile grid</b>, one row per core in the timeline. The third loop runs in order inside each core — the <b>sweep</b>. In os each core keeps its own C block, so the sum over K stays on one core.</p><p class="try">Try: hover a bar in the timeline to see which blocks that core keeps and makes.</p>' },
    { id: 'ws', t: 'K on the grid', set: { mode: 'many', flow: 'ws' }, s: '<h2>When K is spread over cores</h2><p>In ws (cores keep B blocks) or is (cores keep A blocks), two cores make pieces of the <b>same</b> C block. Those cells show “2×” until an extra step adds the pieces <b>across cores</b> — accumulating over <b>space</b>.</p><p class="try">Try: hover a bar — the magenta outline shows the other core that makes the same C blocks.</p>' },
    { id: 'waves', t: 'Waves', set: { mode: 'many', flow: 'os', tm: 1, tn: 2, tk: 2, cores: 3 }, s: '<h2>More tiles than cores: waves</h2><p>8 tiles, 3 cores: the cores take tiles in rounds, called <b>waves</b>. The last wave is only partly full, so some cores sit idle (hatched).</p><p class="try">Try: set Cores to 4 (2 full waves), 5, or 8.</p>' },
    { id: 'osidle', t: 'os runs out of tiles', set: { mode: 'many', flow: 'os', cores: 8 }, s: '<h2>os runs out of tiles</h2><p>In os one core owns one output block and sweeps all of K inside it, so the number of tiles is the number of output blocks: 4 here. With 8 cores, 4 sit idle however long K is.</p><p class="try">Try: raise M and N for more output blocks and more busy cores. Or keep them and go on to split-K.</p>' },
    { id: 'split', t: 'Split-K', set: { mode: 'splitk', pieces: 2, cores: 8 }, s: '<h2>Split-K (an os strategy)</h2><p>Cut each block\'s K sweep into <b>P</b> pieces and make <b>(output block, piece of K)</b> the unit of work: 4 blocks × 2 pieces = 8 tiles for 8 cores. Each piece gives a <b>pale</b> partial block that goes out to <b class="tm">memory</b>; a <b class="tm">second pass</b> reads the pieces back and adds them into C.</p><p class="try">Try: P = 1 (plain os, 4 idle cores), P = 4 (16 tiles, 2 waves, 4 pieces through memory). Watch the violet memory counters: 2·P·16 values.</p>' },
    { id: 'splitws', t: 'Split-K vs ws', set: { mode: 'many', flow: 'ws', tk: 1, cores: 8, g: 1 }, s: '<h2>The other way to 8 tiles: ws</h2><p>ws puts <b>every</b> K-slice on the grid: 4 slices × 2 column blocks = 8 tiles, with no trip through memory. Compare with split-K (P = 2, 8 cores):</p><div class="tw"><table class="cmp"><tr><th></th><th>split-K, P = 2</th><th>ws, K on the grid</th></tr><tr><td>pieces per C value</td><td>2 (big, contiguous)</td><td>4 (every slice)</td></tr><tr><td>additions over time</td><td>32</td><td>0</td></tr><tr><td>the rest</td><td class="mem">16 in pass 2, after 32 written + 32 read</td><td class="tsp">48 across cores</td></tr><tr><td>total</td><td>64 multiplies, 48 additions</td><td>64 multiplies, 48 additions</td></tr></table></div><p class="try">Both buy parallel work by cutting K: split-K pays with memory traffic, ws with additions between cores.</p>' },
    { id: 'wsA', t: 'Weight sets: hide loading', set: { mode: 'wsets', group: 'block', sched: 'overlap', slots: 2, load: 2, both: true }, s: '<h2>(a) Weight sets hide the loading</h2><p>One ws core can <b>store</b> 2 blocks of B (2 weight sets, or slots) but computes with one at a time. While it computes with slot 0, the write port fills slot 1 with the next block; then the roles swap. Both timelines are drawn on the same scale.</p><p class="try">Try: load time 6, longer than the 4 compute steps per block, so even overlapped the compute waits. Slots = 1: nothing to overlap with.</p><p class="try">Real (your figures): Axelera Metis has 4 cores, each with 4 weight sets of 512×512 bytes, computing with one at a time. 4 × 512 × 512 B = 1 MiB per core, which matches the compute memory per core Axelera publishes.</p>' },
    { id: 'wsB', t: 'Weight sets: K in one place', set: { mode: 'wsets', group: 'row', sched: 'overlap', slots: 2, load: 2, both: false }, s: '<h2>(b) Weight sets keep K in one place</h2><p>The slots hold successive K-pieces of the <b>same</b> column of B. Each row of A goes through slot 0, then slot 1, adding into <b>one accumulator</b>: that row of C finishes on this core, with no additions between cores.</p><p class="try">Try: Slots = 1. Now every row must pass B[0,0] before B[1,0] is loaded, and <b>most partial at once</b> jumps from 2 to 8.</p>' },
    { id: 'kg', t: 'Slots → K-groups', set: { mode: 'many', flow: 'ws', tm: 2, tn: 2, tk: 1, cores: 4, g: 2 }, s: '<h2>More cores than columns: K-groups</h2><p>B has only 2 column blocks but there are 4 cores. Cut K into 4 slices and give each core a <b>group</b> of g slices in its slots: it sums its group over time, and only one partial per core is added across cores at the end.</p><p class="try">Try: K-tiles per core = 1, 2, 4 and watch the two addition counters trade places.</p>' },
    { id: 'big', t: 'Playground 8×8×8', set: { M: 8, N: 8, K: 8, seed: 3, mode: 'many', flow: 'ws', tm: 2, tn: 4, tk: 2, cores: 6, g: 2 }, s: '<h2>Playground</h2><p>Bigger random numbers, uneven counts of tiles and cores. Every knob is live; every run still ends with C == A @ B, and the additions over time plus across cores always add up to M·N·(K−1).</p>' }
  ];

  let view = null, cur = 'textbook';
  function fix() {
    ['tm', 'tn', 'tk'].forEach((t, x) => {
      const dim = [S.M, S.N, S.K][x];
      if (dim % S[t] !== 0 || S[t] > dim) { const d = X.divisors(dim).filter((v) => v <= S[t]); S[t] = d[d.length - 1]; }
    });
    const nK = S.K / S.tk;
    if (nK % S.g) S.g = 1;
    if (nK % S.S) S.S = 1;
    if (S.K % S.pieces) { const d = X.divisors(S.K).filter((v) => v <= S.pieces); S.pieces = d[d.length - 1]; }
    S.slots = Math.max(1, Math.min(4, S.slots));
    if (S.mode === 'single' && !S.tiled && S.gran === 'block') S.gran = 'inner';
    if (!(S.M === 4 && S.N === 4 && S.K === 4) && S.seed === 0) S.seed = 1;
  }
  function seg(label, key, opts, lab) {
    const g = el('div', 'kg'); g.appendChild(el('div', 'kl', label));
    const b = el('div', 'seg');
    opts.forEach((v) => {
      const x = el('button', 'btn', lab ? lab(v) : String(v)); x.type = 'button';
      x.setAttribute('aria-pressed', S[key] === v ? 'true' : 'false');
      x.addEventListener('click', () => { S[key] = v; rebuild(); });
      b.appendChild(x);
    });
    g.appendChild(b); return g;
  }
  function slider(label, key, min, max, step, fmt) {
    const g = el('div', 'kg'); const id = 'k-' + key;
    g.appendChild(el('label', 'kl', label + ' <b id="' + id + '-v">' + (fmt ? fmt(S[key]) : S[key]) + '</b>')).setAttribute('for', id);
    const r = el('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = S[key]; r.id = id;
    r.addEventListener('input', () => { S[key] = +r.value; $(id + '-v').textContent = fmt ? fmt(S[key]) : S[key]; if (key === 'speed') { if (view) { view.cfg.speed = S.speed; if (view.timer) { view.stop(); view.play(); } } } });
    r.addEventListener('change', () => { if (key !== 'speed') rebuild(); });
    g.appendChild(r); return g;
  }
  function knobs() {

    const nums = el('div', 'kg'); nums.appendChild(el('div', 'kl', 'Numbers'));

    const r = el('button', 'btn', 'New random 0…3'); r.type = 'button'; r.addEventListener('click', () => { S.seed = (S.seed % 97) + 1; rebuild(); }); nb.appendChild(r);
    nums.appendChild(nb); k.appendChild(nums);
    sec('Where it runs');
    k.appendChild(seg('Mode', 'mode', ['single', 'many', 'splitk', 'wsets'], (v) => ({ single: 'One core', many: 'Many cores', splitk: 'Split-K', wsets: 'Weight sets' }[v])));
    if (S.mode === 'single') {
      k.appendChild(seg('Loop order (inside)', 'inner', X.ORDERS));

    if (S.mode === 'single') {
      if (S.tiled) k.appendChild(seg('Block loop order', 'border', X.ORDERS, BVn));

      k.appendChild(seg('One step is', 'gran', S.tiled ? ['op', 'inner', 'block'] : ['op', 'inner'], (v) => ({ op: '1 multiply', inner: '1 inner loop', block: '1 block product' }[v])));
    } else if (S.mode === 'many') {
      sec('Cores');
      k.appendChild(slider('Cores', 'cores', 1, 8, 1));
      k.appendChild(seg('Flow: what each core keeps', 'flow', ['os', 'ws', 'is'], (v) => ({ os: 'os · C', ws: 'ws · B', is: 'is · A' }[v])));
      const nK = S.K / S.tk;
      if (S.flow !== 'os') k.appendChild(seg('K-tiles per core (K-groups)', 'g', X.divisors(nK)));
    }
    sec('Playback');
    k.appendChild(slider('Speed', 'speed', 0.25, 4, 0.25, (v) => v + '×'));
  }
  function rule() {
    const R = $('rule');
    if (S.mode === 'splitk') {
      const P = X.problem(S.M, S.N, S.K, S.seed), pl = X.splitkPlan(P, S), MN = S.M * S.N;
      R.innerHTML = '<div class="rl"><span class="rk">unit of work</span><b>(output block, piece of K)</b><span class="ar">·</span>' + pl.nM * pl.nN + ' blocks × ' + pl.Pp + ' piece' + (pl.Pp > 1 ? 's' : '') + ' = <b>' + pl.tiles.length + ' tiles</b> on ' + S.cores + ' cores = ' + pl.W + ' wave' + (pl.W > 1 ? 's' : '') + '<span class="ar">·</span><span class="rk">kept in each core</span><span class="stay-c">a C block</span><b>os</b></div>' +
        '<div class="rl"><span class="rk">K-sum</span>' + (pl.Pp > 1 ? 'over time inside a piece (' + MN * (S.K - pl.Pp) + ' additions), then <b class="tm">through memory</b>: ' + pl.Pp * MN + ' written, ' + pl.Pp * MN + ' read back, ' + (pl.Pp - 1) * MN + ' additions in pass 2' : '<b>over time only</b>: each block is finished on one core and written once') + '</div>';

    if (S.mode === 'wsets') {
      const P = X.problem(S.M, S.N, S.K, S.seed), a = X.wsSchedule(P, S, 'seq'), b = X.wsSchedule(P, S, 'overlap');

        '<div class="rl"><span class="rk">time</span>load, then compute: <b>' + a.T + '</b> steps<span class="ar">·</span>overlapped: <b>' + b.T + '</b> steps<span class="ar">·</span><span class="rk">K-sum</span>over time in one core, <b>0</b> additions across cores</div>';
      return;
    }
    if (S.mode === 'single') {
      const v = S.inner[2], st = X.STAY[v], ch = { A: 'A[i][k]', B: 'B[k][j]', C: 'C[i][j]' };
      const moving = ['A', 'B', 'C'].filter((x) => x !== st).map((x) => '<span class="t' + x.toLowerCase() + '">' + ch[x] + '</span>').join(' and ');
      let h = '<div class="rl"><span class="rk">innermost loop</span><b>' + v + '</b><span class="ar">→</span><span class="rk">changes</span>' + moving + '<span class="ar">→</span><span class="rk">stays put</span><span class="stay-' + st.toLowerCase() + '">' + ch[st] + '</span><span class="ar">→</span><b>' + X.STATN[st] + '</b> · ' + X.FORM[S.inner] + '</div>';
      if (S.tiled) { const bv = S.border[2], bst = X.STAY[bv]; h += '<div class="rl"><span class="rk">innermost block loop</span><b>' + X.BV[bv] + '</b><span class="ar">→</span><span class="rk">stays put</span><span class="stay-' + bst.toLowerCase() + '">a ' + bst + ' block</span><span class="ar">→</span><b>' + X.SHORT[bst] + '</b> at block level</div>'; }
      h += '<div class="rl small">' + { op: 'One step = 1 multiply: a CPU core.', inner: 'One step = a whole inner loop: a vector operation (like one row through an in-memory array).', block: 'One step = a whole block product: a tensor core.' }[S.gran] + '</div>';
      R.innerHTML = h;
    } else {
      const f = S.flow, st = { os: 'C', ws: 'B', is: 'A' }[f];
      const grid = { os: 'mt × nt', ws: 'kgroup × nt', is: 'mt × kgroup' }[f], sweep = { os: 'kt', ws: 'mt (then kt inside the group)', is: 'nt (then kt inside the group)' }[f];
      const pl = X.parallelPlan(X.problem(S.M, S.N, S.K, S.seed), S);
      R.innerHTML = '<div class="rl"><span class="rk">tile grid (same time)</span><b>' + grid + '</b><span class="ar">·</span><span class="rk">sweep (in order)</span><b>' + sweep + '</b><span class="ar">·</span><span class="rk">kept in each core</span><span class="stay-' + st.toLowerCase() + '">a ' + st + ' block</span><b>' + f + '</b></div>' +
        '<div class="rl"><span class="rk">K-sum</span>' + (pl.maxParts > 1 ? 'over time inside each core, then <b class="tsp">across cores</b> (' + pl.maxParts + ' pieces per C block, ' + pl.R + ' combine level' + (pl.R > 1 ? 's' : '') + ')' : '<b>over time only</b>, each C block is made on one core') +
        '<span class="ar">·</span><span class="rk">schedule</span>' + pl.U + ' tiles on ' + S.cores + ' cores = ' + pl.W + ' wave' + (pl.W > 1 ? 's' : '') + '</div>';
    }
  }
  function trace() {
    const d = $('trace'); if (!view || !$('tracebox').open) return;
    const lines = view.trace(400);
    d.textContent = lines.length ? lines.join('\n') : '(nothing yet — take a step)';
    d.scrollTop = d.scrollHeight;
  }
  function rebuild() {
    fix();
    if (view) view.destroy();
    const host = $('view'); host.innerHTML = '';
    const d = el('div'); host.appendChild(d);
    const P = X.problem(S.M, S.N, S.K, S.seed);
    const cfg = Object.assign({}, S, { P, onStep: trace });
    view = new ({ single: X.SingleView, many: X.ParallelView, splitk: X.SplitKView, wsets: X.WSView }[S.mode])(d, cfg);
    knobs(); rule(); trace();
  }
  function chapter(id) {
    const c = CH.find((x) => x.id === id); cur = id;
    Object.keys(DEF).forEach((k) => { S[k] = DEF[k]; });
    Object.assign(S, c.set);
    if (S.mode === 'many') { S.tiled = true; }
    $('story').innerHTML = c.s;
    document.querySelectorAll('#chapters button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.id === id ? 'true' : 'false'));
    rebuild();
  }
  const bar = $('chapters');
  CH.forEach((c, n) => { const b = el('button', 'btn chap', '<span>' + (n + 1) + '</span>' + c.t); b.type = 'button'; b.dataset.id = c.id; b.addEventListener('click', () => chapter(c.id)); bar.appendChild(b); });
  $('tracebox').addEventListener('toggle', trace);
  document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    if (view && view.keydown(e)) e.preventDefault();
  });
  window.LAB = { S, rebuild, chapter, CH, get view() { return view; } };
  chapter('textbook');
})();
</script>
</body>
